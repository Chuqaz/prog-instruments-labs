[tool.ruff]

exclude = [
    ".git",
    "venv",
    ".venv",
    "build"
]

target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "UP",
    "B",
    "SIM",
    "I",
]

ignore=[]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"


[tool.pyright]
typeCheckingMode = "standard"

include=['.']
exclude = ["**/__pycache__",".venv"]

venv='.venv'

reportMissingImports=true
reportMissingTypeStubs=false
